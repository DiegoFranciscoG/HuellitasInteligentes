server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip
    gzip on;
    gzip_types text/plain application/javascript text/css application/json;

    # ── Cabeceras de seguridad ──────────────────────────────────────────────
    # HSTS no se incluye aquí: forzarla sin confirmar que HTTPS está activo de
    # forma confiable de punta a punta puede dejar a los usuarios sin acceso.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(self)" always;

    # Subida de fotos y videos de la comunidad (el backend acepta hasta 50 MB).
    client_max_body_size 50M;

    # ── Backend ─────────────────────────────────────────────────────────────
    # La web y la API se sirven desde el MISMO dominio: nginx reenvía /api al
    # contenedor del backend. Así basta un dominio y un certificado, no hay
    # CORS, y el navegador no bloquea la llamada por contenido mixto (una web
    # en HTTPS no puede pedir a un http://ip:8087).
    location /api/ {
        proxy_pass         http://backend:8087;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── WebSocket ───────────────────────────────────────────────────────────
    # Chat y señalización de las cámaras WebRTC. Necesita Upgrade/Connection
    # para que la conexión pase de HTTP a WebSocket.
    location /ws {
        proxy_pass         http://backend:8087;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Angular SPA: cualquier ruta que no sea un archivo estático → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets (hash en nombre = seguro para cache largo)
    location ~* \.(js|css|png|jpg|webp|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
