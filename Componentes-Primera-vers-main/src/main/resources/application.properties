spring.application.name=esp32
server.address=0.0.0.0
server.port=${SERVER_PORT:8087}

# Observabilidad: solo se expone /actuator/health públicamente (útil para
# monitoreo/uptime). El resto (métricas, env, beans) queda oculto hasta que
# haya autenticación real que lo proteja — no tiene sentido exponer detalles
# internos del servidor sin control de acceso.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# CRÍTICO: excluir auto-configuración OAuth2 y UserDetailsService para que
# nuestra SecurityConfig sea la ÚNICA cadena de filtros — sin redirect ni 401
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.client.OAuth2ClientAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# =========================================================================
# DATASOURCE ÚNICO (Postgres / Neon)
# =========================================================================
spring.datasource.url=jdbc:postgresql://ep-empty-paper-atzhb2iu-pooler.c-9.us-east-1.aws.neon.tech/huellitas_inteligentes?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de resiliencia de pool para Neon PostgreSQL (serverless idle timeout prevention)
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-test-query=SELECT 1

# Límite de carga de archivos (Videos Comunidad 50MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.repair=true

spring.jpa.hibernate.ddl-auto=validate
# JWT Secrets
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}
jwt.refreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

# OAuth2 Google — Client ID del proyecto
google.oauth2.client-id=${GOOGLE_CLIENT_ID}
google.oauth2.client-secret=${GOOGLE_CLIENT_SECRET}
google.oauth2.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8087/api/huellitas/auth/google/callback}

# OAuth2 Facebook — variables de entorno
facebook.oauth2.app-id=${FACEBOOK_APP_ID}
facebook.oauth2.app-secret=${FACEBOOK_APP_SECRET}
facebook.oauth2.redirect-uri=${FACEBOOK_REDIRECT_URI:http://localhost:8087/api/huellitas/auth/facebook/callback}

# Google APIs
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent
google.places.api.key=${GOOGLE_PLACES_API_KEY}

# OpenRouter API (IA & Moderacion)
openrouter.api.key.ia=${OPENROUTER_API_KEY_IA}
openrouter.api.key.moderacion=${OPENROUTER_API_KEY_MOD}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4000}

# Configuracion de Email (Brevo API + Resend API Key fallback)
resend.api.key=${RESEND_API_KEY}

# Pagos con Stripe
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY}
app.web-url=${APP_WEB_URL:http://localhost:4200}

# =========================================================================
# CREDENCIALES — todas por variable de entorno, ninguna escrita aqui.
# Copia .env.example y define estas variables antes de arrancar.
# =========================================================================
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME:Huellitas App}

storage.media.access-key=${B2_MEDIA_ACCESS_KEY}
storage.media.secret-key=${B2_MEDIA_SECRET_KEY}
storage.avatar.access-key=${B2_AVATAR_ACCESS_KEY}
storage.avatar.secret-key=${B2_AVATAR_SECRET_KEY}
openai.api.key.moderacion=${OPENAI_API_KEY_MODERACION}

# Sightengine (moderacion de texto e imagen) - sin default: si no se define
# la variable de entorno, SightengineService queda inactivo y no bloquea nada.
sightengine.api.user=${SIGHTENGINE_API_USER:}
sightengine.api.secret=${SIGHTENGINE_API_SECRET:}

# URL de la web, usada en los enlaces de los correos (recuperar contrasena, etc.)
app.frontend.url=${APP_WEB_URL:http://localhost:4200}

# Varios @Scheduled comparten un solo hilo por defecto (TokenCleanupTask,
# IotAlertaJob, MomentoMascotaJob...). MomentoMascotaJob puede tardar varios
# segundos capturando una ráfaga de la cámara, y con un solo hilo eso retrasaría
# a los demás. Un pool pequeño evita que se pisen entre sí.
spring.task.scheduling.pool.size=4

# Momentos de tu mascota (detección por cámara IoT)
momento.mascota.cooldown-segundos=${MOMENTO_MASCOTA_COOLDOWN_SEGUNDOS:90}
momento.mascota.umbral-confianza=${MOMENTO_MASCOTA_UMBRAL_CONFIANZA:0.55}

# Token para los endpoints del firmware ESP32 (DeviceTokenFilter).
# Mientras esta variable esté vacía, el filtro opera en modo transición:
# deja pasar todo sin cambios — el IoT sigue funcionando exactamente igual.
# Definir SOLO cuando Fernando haya actualizado ambas placas con el nuevo firmware.
iot.device.token=${IOT_DEVICE_TOKEN:}
