name: mascotas_app
description: "Smart Pet Home Control App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  http_parser: ^4.0.2
  provider: ^6.0.5
  webview_flutter: ^4.10.0
  flutter_dotenv: ^5.1.0
  google_fonts: ^6.1.0
  url_launcher: ^6.3.0
  # Escucha el enlace huellitas://oauth-callback por el que Facebook regresa
  # el token tras iniciar sesión en el navegador (ver login_screen.dart).
  app_links: ^6.3.2
  google_sign_in: ^7.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  flutter_webrtc: ^1.6.0
  stomp_dart_client: ^3.0.1
  file_picker: ^8.1.4
  flutter_animate: ^4.5.0
  geolocator: ^13.0.1
  share_plus: ^12.0.2

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/icon.png