services:
  backend:
    build: ./Componentes-Primera-vers-main
    ports:
      - "${SERVER_PORT:-8087}:8087"
    environment:
      # ── OBLIGATORIAS en prod ──────────────────────────
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # ── Auth ─────────────────────────────────────────
      - JWT_SECRET=${JWT_SECRET:-cambiar_en_produccion_12345}
      - JWT_EXPIRATION_MS=86400000
      - JWT_REFRESH_EXPIRATION_MS=604800000
      # ── OAuth ────────────────────────────────────────
      - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-placeholder}
      - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-placeholder}
    restart: unless-stopped
    networks:
      - huellitas-net

  frontend:
    build: ./huellitas-web
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - huellitas-net

networks:
  huellitas-net:
    driver: bridge
